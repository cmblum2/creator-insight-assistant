<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Creator Insight Assistant</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.3rem; }
    textarea { width: 100%; height: 70px; font-size: 1rem; padding: 8px; }
    button { padding: 8px 16px; font-size: 1rem; cursor: pointer; margin-top: 8px; }
    label { font-size: .9rem; }
    #answer { white-space: pre-wrap; background: #f6f6f6; padding: 12px; border-radius: 6px; margin-top: 16px; }
    #sources { font-size: .8rem; color: #555; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Creator Insight Assistant <small>(RAG over creator + comment data)</small></h1>
  <textarea id="q" placeholder="e.g. Which creators mention dry or damaged hair?"></textarea><br />
  <label><input type="checkbox" id="intent" /> only buy-intent comments</label><br />
  <button onclick="ask()">Ask</button>
  <div id="answer"></div>
  <div id="sources"></div>
  <script>
    async function ask() {
      const question = document.getElementById('q').value;
      document.getElementById('answer').textContent = 'thinking…';
      document.getElementById('sources').textContent = '';
      const res = await fetch('/ask', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, intent_only: document.getElementById('intent').checked })
      });
      const data = await res.json();
      document.getElementById('answer').textContent = data.answer;
      document.getElementById('sources').textContent =
        'sources: ' + data.sources.map(s => s.handle || s.source).join(', ');
    }
  </script>
</body>
</html>
